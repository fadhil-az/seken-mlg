<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Seken.mlg</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .admin-page {
      padding: 40px 0 80px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .admin-header h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .admin-header p {
      color: #778078;
      font-size: 13px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .admin-btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font: 600 13px Poppins;
      cursor: pointer;
    }

    .btn-refresh {
      background: #edf5ee;
      color: #397246;
    }

    .btn-home {
      background: #4e8d59;
      color: white;
    }

    .admin-card {
      background: white;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .admin-card-top {
      display: flex;
      gap: 20px;
    }

    .admin-image {
      width: 180px;
      height: 150px;
      border-radius: 14px;
      background: #eaf2ea;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .admin-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .admin-image span {
      font-size: 45px;
    }

    .admin-info {
      flex: 1;
    }

    .admin-info h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .admin-price {
      color: #397446;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .admin-meta {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: #778078;
      margin-bottom: 12px;
    }

    .admin-description {
      font-size: 12px;
      line-height: 1.7;
      color: #68736b;
    }

    .admin-status {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fff4d6;
      color: #9a6700;
      font-size: 11px;
      font-weight: 700;
    }

    .admin-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid #edf0ed;
      margin-top: 20px;
      padding-top: 15px;
    }

    .approve-btn,
    .reject-btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 17px;
      font: 600 12px Poppins;
      cursor: pointer;
    }

    .approve-btn {
      background: #e6f7ed;
      color: #218739;
    }

    .reject-btn {
      background: #fde8e8;
      color: #c53030;
    }

    .empty-admin {
      text-align: center;
      background: white;
      border: 1px solid #e1e8e2;
      border-radius: 18px;
      padding: 50px 20px;
      color: #778078;
      font-size: 13px;
    }

    @media(max-width:700px) {
      .admin-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .admin-card-top {
        flex-direction: column;
      }

      .admin-image {
        width: 100%;
        height: 200px;
      }

      .admin-footer {
        justify-content: stretch;
      }

      .approve-btn,
      .reject-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="container nav-inner">

      <button class="brand" onclick="location.href='index.html'">
        <span class="brand-dot"></span>
        Seken<span>.mlg</span>
      </button>

      <div style="flex:1"></div>

      <button class="admin-btn btn-home"
              onclick="location.href='index.html'">
        ← Kembali ke Website
      </button>

    </div>
  </header>

  <main class="container admin-page">

    <div class="admin-header">

      <div>
        <h1>Dashboard Admin</h1>
        <p>Kelola dan verifikasi barang yang dijual pengguna.</p>
      </div>

      <div class="admin-actions">

        <button class="admin-btn btn-refresh"
                onclick="loadPendingProducts()">
          ↻ Refresh
        </button>

      </div>

    </div>

    <div id="admin-products">
      <div class="empty-admin">
        Memuat barang...
      </div>
    </div>

  </main>

  <script src="supabase-config.js"></script>

  <script>

    let currentAdmin = null;

    async function checkAdmin() {

      const {
        data: {
          user
        }
      } = await window.supabaseClient.auth.getUser();

      if (!user) {

        alert("Silakan login terlebih dahulu.");

        window.location.href = "login.html";

        return false;
      }

      const {
        data: isAdmin,
        error
      } = await window.supabaseClient.rpc("is_admin");

      if (error || !isAdmin) {

        alert("Akses admin ditolak.");

        window.location.href = "index.html";

        return false;
      }

      currentAdmin = user;

      return true;
    }


    async function loadPendingProducts() {

      const container =
        document.getElementById("admin-products");

      container.innerHTML = `
        <div class="empty-admin">
          Memuat barang...
        </div>
      `;

      const {
        data,
        error
      } = await window.supabaseClient
        .from("products")
        .select("*")
        .eq("status", "pending")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(error);

        container.innerHTML = `
          <div class="empty-admin">
            Gagal memuat data barang.
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty-admin">
            <div style="font-size:40px;margin-bottom:10px;">
              ✓
            </div>

            Tidak ada barang yang menunggu persetujuan.
          </div>
        `;

        return;
      }


      container.innerHTML =
        data.map(product => {

          const image = product.image_url
            ? `
              <img
                src="${product.image_url}"
                alt="${product.name}"
              >
            `
            : `
              <span>📦</span>
            `;

          const price =
            Number(product.price || 0)
              .toLocaleString("id-ID");


          return `

            <div class="admin-card">

              <div class="admin-card-top">

                <div class="admin-image">
                  ${image}
                </div>

                <div class="admin-info">

                  <h2>
                    ${product.name}
                  </h2>

                  <div class="admin-price">
                    Rp ${price}
                  </div>

                  <div class="admin-meta">

                    <span>
                      📂 Kategori:
                      ${product.category}
                    </span>

                    <span>
                      📦 Kondisi:
                      ${product.condition}
                    </span>

                    <span>
                      📍 Lokasi:
                      ${product.location || "-"}
                    </span>

                    <span>
                      👤 Penjual:
                      ${product.seller_name || "-"}
                    </span>

                  </div>

                  <div class="admin-description">
                    ${product.description || "Tidak ada deskripsi."}
                  </div>

                  <div class="admin-status">
                    ⏳ Menunggu Persetujuan
                  </div>

                </div>

              </div>

              <div class="admin-footer">

                <button
                  class="reject-btn"
                  onclick="rejectProduct('${product.id}')">
                  ✕ Tolak
                </button>

                <button
                  class="approve-btn"
                  onclick="approveProduct('${product.id}')">
                  ✓ Setujui
                </button>

              </div>

            </div>

          `;

        }).join("");
    }


    async function approveProduct(productId) {

      const confirmApprove =
        confirm("Setujui barang ini?");

      if (!confirmApprove) return;


      const {
        error
      } = await window.supabaseClient
        .from("products")
        .update({
          status: "approved",
          approved_by: currentAdmin.id,
          approved_at: new Date().toISOString(),
          rejection_reason: null
        })
        .eq("id", productId);


      if (error) {

        console.error(error);

        alert(
          "Gagal menyetujui barang."
        );

        return;
      }


      alert(
        "Barang berhasil disetujui."
      );

      loadPendingProducts();
    }


    async function rejectProduct(productId) {

      const reason =
        prompt(
          "Masukkan alasan penolakan:"
        );

      if (!reason || !reason.trim()) {

        alert(
          "Alasan penolakan harus diisi."
        );

        return;
      }


      const {
        error
      } = await window.supabaseClient
        .from("products")
        .update({
          status: "rejected",
          approved_by: currentAdmin.id,
          approved_at: null,
          rejection_reason: reason.trim()
        })
        .eq("id", productId);


      if (error) {

        console.error(error);

        alert(
          "Gagal menolak barang."
        );

        return;
      }


      alert(
        "Barang berhasil ditolak."
      );

      loadPendingProducts();
    }


    async function initAdmin() {

      const isAdmin =
        await checkAdmin();

      if (!isAdmin) return;

      await loadPendingProducts();
    }


    initAdmin();

  </script>

</body>
</html>
