<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Seken.mlg</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 18px 30px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #16834b;
    }

    .admin-label {
      font-size: 14px;
      color: #777;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .admin-card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .product {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
    }

    .product img {
      width: 150px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .no-image {
      width: 150px;
      height: 120px;
      border-radius: 10px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product-info {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    .description {
      margin-top: 8px;
      color: #555;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #16834b;
      color: white;
    }

    .reject {
      background: #fde8e8;
      color: #c53030;
    }

    .logout {
      background: #eee;
      color: #333;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    #message {
      margin-bottom: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .product {
        grid-template-columns: 1fr;
      }

      .product img,
      .no-image {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      seken.mlg
    </div>

    <div class="admin-label">
      🛡️ Panel Admin
    </div>

  </div>
</header>

<div class="container">

  <h1>Dashboard Admin</h1>

  <p class="subtitle">
    Kelola barang yang diajukan oleh pengguna Seken.mlg.
  </p>

  <div id="message"></div>

  <div id="pendingProducts"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let currentAdmin = null;


/* =========================================
   CEK ADMIN
========================================= */

async function checkAdmin() {

  const {
    data: {
      session
    }
  } = await window.supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  currentAdmin = session.user;

  const {
    data,
    error
  } = await window.supabaseClient.rpc("is_admin");

  if (error || !data) {

    alert("Akses hanya untuk admin.");

    window.location.href = "index.html";

    return;
  }

  loadPendingProducts();
}


/* =========================================
   LOAD BARANG PENDING
========================================= */

async function loadPendingProducts() {

  const container =
    document.getElementById("pendingProducts");

  container.innerHTML =
    "<p>Memuat barang...</p>";

  const {
    data: products,
    error
  } = await window.supabaseClient
    .from("products")
    .select("*")
    .eq("status", "pending")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    container.innerHTML =
      "<div class='empty'>Gagal memuat barang.</div>";

    console.error(error);

    return;
  }

  if (!products || products.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>Tidak ada barang pending</h3>
        <p>Semua barang sudah diperiksa.</p>
      </div>
    `;

    return;
  }

  container.innerHTML =
    products.map(product => {

      const image =
        product.image_url
          ? `
            <img
              src="${product.image_url}"
              alt="${product.name}"
            >
          `
          : `
            <div class="no-image">
              📦
            </div>
          `;

      const price =
        Number(product.price || 0)
          .toLocaleString("id-ID");

      return `

        <div class="admin-card">

          <div class="product">

            <div>
              ${image}
            </div>

            <div>

              <h3>${product.name}</h3>

              <div class="product-info">

                <div>
                  Kategori: ${product.category}
                </div>

                <div>
                  Harga: Rp ${price}
                </div>

                <div>
                  Kondisi: ${product.condition}
                </div>

                <div>
                  Lokasi COD: ${product.location || "-"}
                </div>

                <div>
                  Penjual: ${product.seller_name || "-"}
                </div>

              </div>

              <div class="description">
                ${product.description || "-"}
              </div>

              <div class="actions">

                <button
                  class="approve"
                  onclick="approveProduct('${product.id}')">
                  ✓ Setujui
                </button>

                <button
                  class="reject"
                  onclick="rejectProduct('${product.id}')">
                  ✕ Tolak
                </button>

              </div>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================================
   SETUJUI BARANG
========================================= */

async function approveProduct(productId) {

  const {
    error
  } = await window.supabaseClient
    .from("products")
    .update({
      status: "approved",
      approved_by: currentAdmin.id,
      approved_at: new Date().toISOString(),
      rejection_reason: null
    })
    .eq("id", productId);

  if (error) {

    alert(
      "Gagal menyetujui barang: " +
      error.message
    );

    return;
  }

  alert("Barang berhasil disetujui.");

  loadPendingProducts();
}


/* =========================================
   TOLAK BARANG
========================================= */

async function rejectProduct(productId) {

  const reason =
    prompt(
      "Masukkan alasan penolakan barang:"
    );

  if (!reason || !reason.trim()) {
    return;
  }

  const {
    error
  } = await window.supabaseClient
    .from("products")
    .update({
      status: "rejected",
      approved_by: currentAdmin.id,
      approved_at: null,
      rejection_reason: reason.trim()
    })
    .eq("id", productId);

  if (error) {

    alert(
      "Gagal menolak barang: " +
      error.message
    );

    return;
  }

  alert("Barang ditolak.");

  loadPendingProducts();
}


/* =========================================
   MULAI
========================================= */

checkAdmin();

</script>

</body>
</html>
