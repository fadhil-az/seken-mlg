<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Seken.mlg</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #16834b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #116b3d;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #16834b;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">seken.mlg</div>

    <div class="subtitle">
        Masuk ke akun kamu
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Masukkan email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            required
        >

        <button type="submit">
            Masuk
        </button>

    </form>

    <div id="message"></div>

<div style="text-align:center; margin-top:15px;">
    <a
        href="#"
        id="forgotPassword"
        style="color:#16834b; font-weight:bold; text-decoration:none;">
        Lupa Password?
    </a>
</div>

<div class="register">
    Belum punya akun?
    <a href="register.html">Daftar</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent =
        "Sedang masuk...";

    /* ==============================
       LOGIN SUPABASE
    ============================== */

    const { data, error } =
        await window.supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        message.textContent =
            "Login gagal: " + error.message;

        return;
    }


    /* ==============================
       CEK ROLE ADMIN
    ============================== */

    const {
        data: isAdmin,
        error: roleError
    } =
        await window.supabaseClient.rpc("is_admin");


    if (roleError) {

        console.error(roleError);

        message.textContent =
            "Login berhasil, tetapi gagal mengecek role.";

        return;
    }


    /* ==============================
       REDIRECT SESUAI ROLE
    ============================== */

    message.textContent =
        "Login berhasil!";


    setTimeout(() => {

        if (isAdmin === true) {

            window.location.href =
                "admin.html";

        } else {

            window.location.href =
                "index.html";

        }

    }, 800);

});


/* =================================
   LUPA PASSWORD
================================= */

document
.getElementById("forgotPassword")
.addEventListener("click", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");

    if (!email) {

        message.textContent =
            "Masukkan email terlebih dahulu.";

        return;
    }

    message.textContent =
        "Mengirim email reset password...";


    const { error } =
        await window.supabaseClient
        .auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                    "https://fadhil-az.github.io/seken-mlg/reset-password.html"
            }
        );


    if (error) {

        message.textContent =
            "Gagal mengirim reset password: " +
            error.message;

        return;
    }


    message.textContent =
        "Email reset password sudah dikirim. Silakan cek Gmail.";

});

</script>
