<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Seken.mlg</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reset-box {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #16834b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #116b3d;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="reset-box">

  <div class="logo">seken.mlg</div>

  <div class="subtitle">
    Buat password baru
  </div>

  <form id="resetForm">

    <label>Password Baru</label>

    <input
      type="password"
      id="newPassword"
      placeholder="Masukkan password baru"
      minlength="6"
      required
    >

    <label>Konfirmasi Password</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Ulangi password baru"
      minlength="6"
      required
    >

    <button type="submit">
      Simpan Password
    </button>

  </form>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

document
.getElementById("resetForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("message");

  if (newPassword !== confirmPassword) {

    message.textContent =
      "Password tidak sama.";

    return;
  }

  message.textContent =
    "Menyimpan password...";

  const { error } =
    await window.supabaseClient.auth.updateUser({
      password: newPassword
    });

  if (error) {

    message.textContent =
      "Gagal mengubah password: " + error.message;

    return;
  }

  message.textContent =
    "Password berhasil diubah! Silakan login.";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);

});

</script>

</body>
</html>
