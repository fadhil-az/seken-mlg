<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seken.mlg - Jual Beli Barang Bekas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #16834b;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #333;
        }

        .btn-jual {
            background: #16834b;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            padding: 55px 7%;
            text-align: center;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #666;
            margin-bottom: 25px;
        }

        .search-box {
            max-width: 650px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .search-box button {
            border: none;
            background: #16834b;
            color: white;
            padding: 0 22px;
            border-radius: 10px;
            cursor: pointer;
        }

        .container {
            width: 86%;
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .category {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .category:hover {
            background: #16834b;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding-bottom: 60px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .product-image {
            height: 180px;
            background: #e9eeeb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #16834b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .condition {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .location {
            font-size: 13px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
            grid-column: 1 / -1;
        }

        footer {
            background: #16834b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            header {
                padding: 15px 5%;
            }

            nav {
                gap: 10px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">seken.mlg</div>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="login.html">Masuk</a>
        <a href="register.html">Daftar</a>
        <a href="jual.html" class="btn-jual">+ Jual Barang</a>
    </nav>
</header>

<section class="hero">

    <h1>Jual & Beli Barang Bekas</h1>

    <p>
        Temukan barang bekas berkualitas dengan harga terjangkau di Malang.
    </p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Cari buku, elektronik, pakaian..."
        >

        <button onclick="searchProducts()">
            Cari
        </button>
    </div>

</section>

<div class="container">

    <h2 class="section-title">Kategori</h2>

    <div class="categories">

        <div class="category" onclick="filterCategory('Semua')">
            Semua
        </div>

        <div class="category" onclick="filterCategory('Buku')">
            Buku
        </div>

        <div class="category" onclick="filterCategory('Elektronik')">
            Elektronik
        </div>

        <div class="category" onclick="filterCategory('Pakaian')">
            Pakaian
        </div>

        <div class="category" onclick="filterCategory('Kos')">
            Perlengkapan Kos
        </div>

    </div>

    <h2 class="section-title">Barang Terbaru</h2>

    <div id="productList" class="products">

        <div class="loading">
            Memuat produk...
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Seken.mlg - Jual Beli Barang Bekas di Malang</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let allProducts = [];

async function loadProducts() {

    const productList =
        document.getElementById("productList");

    const { data, error } =
        await window.supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        productList.innerHTML = `
            <div class="empty">
                Gagal mengambil data produk.
                <br>
                ${error.message}
            </div>
        `;

        return;
    }

    allProducts = data || [];

    displayProducts(allProducts);
}


function displayProducts(products) {

    const productList =
        document.getElementById("productList");

    if (products.length === 0) {

        productList.innerHTML = `
            <div class="empty">
                Belum ada barang yang dijual.
            </div>
        `;

        return;
    }

    productList.innerHTML =
        products.map(product => {

            const image =
                product.image_url;

            return `
                <div class="product">

                    <div class="product-image">

                        ${
                            image
                            ?
                            `<img src="${image}" alt="${product.name}">`
                            :
                            `Belum ada foto`
                        }

                    </div>

                    <div class="product-info">

                        <div class="product-name">
                            ${product.name}
                        </div>

                        <div class="price">
                            Rp${Number(product.price).toLocaleString("id-ID")}
                        </div>

                        <div class="condition">
                            Kondisi: ${product.condition}
                        </div>

                        <div class="location">
                            📍 ${product.location || "Malang"}
                        </div>

                    </div>

                </div>
            `;

        }).join("");
}


function searchProducts() {

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered =
        allProducts.filter(product =>
            product.name
            .toLowerCase()
            .includes(keyword)
        );

    displayProducts(filtered);
}


function filterCategory(category) {

    if (category === "Semua") {

        displayProducts(allProducts);

        return;
    }

    const filtered =
        allProducts.filter(product =>
            product.category === category
        );

    displayProducts(filtered);
}


loadProducts();

</script>

</body>
</html>
