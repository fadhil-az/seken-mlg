<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - Seken.mlg</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            margin-bottom: 16px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #16834b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #116b3d;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #16834b;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">seken.mlg</div>

    <div class="subtitle">
        Buat akun baru
    </div>

    <form id="registerForm">

        <label>Nama</label>

        <input
            type="text"
            id="name"
            placeholder="Nama lengkap"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Minimal 6 karakter"
            minlength="6"
            required
        >

        <label>Lokasi</label>

        <input
            type="text"
            id="location"
            placeholder="Contoh: Malang"
            required
        >

        <button type="submit">
            Daftar
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Sudah punya akun?
        <a href="login.html">Masuk</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const location =
        document.getElementById("location").value;

    const message =
        document.getElementById("message");

    message.textContent =
        "Membuat akun...";

    const { data, error } =
        await supabase.auth.signUp({
            email: email,
            password: password
        });

    if (error) {

        message.textContent =
            "Pendaftaran gagal: " +
            error.message;

        return;
    }

    if (!data.user) {

        message.textContent =
            "Pendaftaran gagal.";

        return;
    }

    const { error: profileError } =
        await supabase
        .from("profiles")
        .insert({
            id: data.user.id,
            name: name,
            location: location
        });

    if (profileError) {

        message.textContent =
            "Akun berhasil dibuat, tetapi " +
            "profil gagal disimpan: " +
            profileError.message;

        return;
    }

    message.textContent =
        "Pendaftaran berhasil! Silakan login.";

    setTimeout(() => {

        window.location.href =
            "login.html";

    }, 1500);

});

</script>

</body>
</html>
